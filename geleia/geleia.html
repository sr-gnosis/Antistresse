<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bolha Elástica</title>
<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0b0f14;
}
canvas{display:block}
#hint{
  position:fixed;
  bottom:12px;
  left:12px;
  color:rgba(255,255,255,.5);
  font-family:Arial;
  font-size:13px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hint">Clique e arraste para deformar a bolha</div>

<script>
const canvas = c = document.getElementById("c");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;
onresize = () => { c.width=innerWidth; c.height=innerHeight };

const COLS = 80;
const ROWS = 80;
const SPACING = 8;
const DAMPING = 0.98;
const SPRING = 0.12;
const DEPTH_LIMIT = 120;

let mouse = {x:0,y:0,px:0,py:0,down:false};

class Point{
  constructor(x,y){
    this.x=x; this.y=y;
    this.z=0;
    this.vz=0;
  }

  update(){
    this.vz *= DAMPING;
    this.z += this.vz;
    this.vz += -this.z * SPRING;
  }
}

let grid=[];

function createBubble(){
  grid=[];
  const cx=c.width/2 - COLS*SPACING/2;
  const cy=c.height/2 - ROWS*SPACING/2;
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      grid.push(new Point(
        cx + x*SPACING,
        cy + y*SPACING
      ));
    }
  }
}

function loop(){
  ctx.clearRect(0,0,c.width,c.height);

  grid.forEach(p=>p.update());

  if(mouse.down){
    grid.forEach(p=>{
      const d=Math.hypot(p.x-mouse.x,p.y-mouse.y);
      if(d<60){
        const force=(1-d/60)*8;
        p.vz -= force;
        if(p.z<-DEPTH_LIMIT){
          p.z=-DEPTH_LIMIT;
          p.vz*= -0.4;
        }
      }
    });
  }

  ctx.beginPath();
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const i=y*COLS+x;
      const p=grid[i];
      if(x===0)ctx.moveTo(p.x,p.y+p.z);
      else ctx.lineTo(p.x,p.y+p.z);
    }
  }

  ctx.strokeStyle="rgba(160,200,255,.35)";
  ctx.stroke();

  requestAnimationFrame(loop);
}

c.onmousedown=()=>mouse.down=true;
c.onmouseup=()=>mouse.down=false;
c.onmousemove=e=>{
  mouse.px=mouse.x;
  mouse.py=mouse.y;
  mouse.x=e.clientX;
  mouse.y=e.clientY;
};

createBubble();
loop();
</script>
</body>
</html>
