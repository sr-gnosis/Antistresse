<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Corte de Camadas – Espada (estável)</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
}

canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.layer {
    position: fixed;
    inset: 0;
}

.falling {
    animation: fall 2.2s ease-in forwards;
}

@keyframes fall {
    to {
        transform: translateY(140vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="layer" class="layer"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const layer = document.getElementById("layer");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
onresize = resize;

function randomColor() {
    return `hsl(${Math.random() * 360}, 70%, 50%)`;
}
layer.style.backgroundColor = randomColor();

/* =====================
   DADOS DO GOLPE
===================== */
let cuts = [];
let mouse = { x:0, y:0, px:0, py:0, down:false };
let startX = 0, startY = 0;
let maxSpeed = 0;
let cutting = false;

const SPEED_THRESHOLD = 18;
const EDGE_MARGIN = 80;

/* =====================
   DESENHO DA LINHA
===================== */
function drawCuts() {
    cuts = cuts.filter(c => c.life > 0);
    cuts.forEach(c => {
        ctx.beginPath();
        ctx.moveTo(c.x1, c.y1);
        ctx.lineTo(c.x2, c.y2);
        ctx.strokeStyle = `rgba(255,255,255,${c.life})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        c.life -= 0.05;
    });
}

function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawCuts();
    requestAnimationFrame(loop);
}
loop();

/* =====================
   INPUT
===================== */
document.onmousedown = e => {
    mouse.down = true;
    startX = mouse.x = mouse.px = e.clientX;
    startY = mouse.y = mouse.py = e.clientY;
    maxSpeed = 0;
};

document.onmousemove = e => {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    if (!mouse.down) return;

    const dx = mouse.x - mouse.px;
    const dy = mouse.y - mouse.py;
    const speed = Math.hypot(dx, dy);
    maxSpeed = Math.max(maxSpeed, speed);

    if (speed > SPEED_THRESHOLD) {
        cuts.push({
            x1: mouse.px,
            y1: mouse.py,
            x2: mouse.x,
            y2: mouse.y,
            life: 1
        });
    }
};

document.onmouseup = () => {
    if (!mouse.down) return;
    mouse.down = false;

    if (cutting) return;
    if (maxSpeed < SPEED_THRESHOLD) return;

    if (validFullCut(startX, startY, mouse.x, mouse.y)) {
        executeCut(startX, startY, mouse.x, mouse.y);
    }
};

/* =====================
   VALIDAÇÃO REAL DO CORTE
===================== */
function nearEdge(x, y) {
    return (
        x < EDGE_MARGIN ||
        x > innerWidth - EDGE_MARGIN ||
        y < EDGE_MARGIN ||
        y > innerHeight - EDGE_MARGIN
    );
}

function validFullCut(x1, y1, x2, y2) {
    return nearEdge(x1, y1) && nearEdge(x2, y2);
}

/* =====================
   CORTE DA CAMADA
===================== */
function executeCut(x1, y1, x2, y2) {
    cutting = true;

    const dx = x2 - x1;
    const dy = y2 - y1;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    const falling = layer.cloneNode(true);
    falling.classList.add("falling");
    falling.style.transform = `rotate(${angle}deg)`;
    falling.style.transformOrigin = "center center";

    document.body.appendChild(falling);
    layer.style.backgroundColor = randomColor();

    setTimeout(() => {
        falling.remove();
        cutting = false;
    }, 2300);
}
</script>

</body>
</html>
